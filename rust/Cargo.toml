[package]
name = "sansreplace"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# A library for python/load_rust.py to load, as python/load_cpp.py loads the
# C++ one
[lib]
crate-type = ["cdylib"]

# We deliberately don't enable the "unbiased" feature. The default
# random_range is very slightly biased (at worst 1 in 2^96 for u32), but
# the unbiased version adds a cost per sample, which would unfairly favour
# algorithms that draw fewer samples.
[dependencies.rand]
version = "0.10.3"
