[package]
name = "sansreplace"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
csv = "1.1"
anyhow = "1.0.68"

[dependencies.clap]
version = "4.0.32"
features = ["derive"]

# We deliberately don't enable the "unbiased" feature. The default
# random_range is very slightly biased (at worst 1 in 2^96 for u32), but
# the unbiased version adds a cost per sample, which would unfairly favour
# algorithms that draw fewer samples.
[dependencies.rand]
version = "0.10.3"
