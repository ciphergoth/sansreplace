name: Publish the explorer and the paper to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "web/**"
      - "results/latest/**"
      - "python/**"
      - "latex/**"
      - "devenv.nix"
      - "devenv.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build in the same devenv as locally, so the paper gets the same TeX Live
      # and the same patched minted
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v17
        with:
          name: devenv
      - run: nix profile install nixpkgs#devenv
      - run: cp -r web _site
      - run: devenv shell -- python/export_web --out _site/generated/data.json
      - run: devenv shell -- latex/do_build
      - run: cp latex/build/latex.out/cardchoose.pdf _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
